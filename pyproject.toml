[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quillancode"
version = "1.0.0"
description = "Sovereign multi-provider code-assistant CLI/TUI with tools, agents, council, MCP and skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quillan-Ronin" }]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13", "prompt_toolkit>=3"]

[project.scripts]
quillancode = "quillancode.cli:main"

[tool.setuptools.packages.find]
include = ["quillancode*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
